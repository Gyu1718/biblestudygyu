name: Validate and apply shared study tools

on:
  push:
    branches: [main]
    paths:
      - "ot/**/*.html"
      - "nt/**/*.html"
      - "theology/**/*.html"
      - "bible/**"
      - "content/encyclopedia/**"
      - "data/xrefs/**"
      - "assets/app.js"
      - "assets/theme.css"
      - "assets/app.css"
      - "assets/js/bible-reader.js"
      - "assets/js/original-reader.js"
      - "assets/js/research-dock-loader.js"
      - "assets/js/research-dock.js"
      - "assets/css/bible-reader.css"
      - "assets/css/original-reader.css"
      - "assets/css/research-dock.css"
      - "assets/css/study-navigation-policy.css"
      - "assets/data/bible/kor/**"
      - "assets/data/bible/original/na28/**"
      - "assets/data/encyclopedia/index.json"
      - "tools/apply_romans_patch.py"
      - "tools/romans-patches/**"
      - "tools/apply_study_tools.py"
      - "tools/apply_bible_reader.py"
      - "tools/apply_cross_references.py"
      - "tools/update_xrefs.py"
      - "tools/build_encyclopedia_index.py"
      - "tools/repair_site_integrity.py"
      - "tools/run_site_integrity_batch.py"
      - "tools/requirements-encyclopedia.txt"
      - "tools/extract_na28_epub.py"
      - "tools/genesis-publish.tar.xz.b64"
      - ".github/workflows/bible-reader.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/repair_site_integrity.py"
      - "tools/run_site_integrity_batch.py"
      - "tools/apply_cross_references.py"
      - "tools/update_xrefs.py"
      - "data/xrefs/**"
      - "assets/js/original-reader.js"
      - "assets/js/research-dock.js"
      - "assets/css/original-reader.css"
      - "assets/app.js"
      - "bible/original.html"
      - ".github/workflows/bible-reader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply staged Genesis shelf bundle
        shell: bash
        run: |
          if [ ! -f tools/genesis-publish.tar.xz.b64 ]; then
            echo "No staged Genesis bundle"
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          root = Path('.').resolve()
          bundle = Path('tools/genesis-publish.tar.xz.b64')
          payload = base64.b64decode(bundle.read_text(encoding='ascii'), validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:xz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('empty Genesis bundle')
              for member in members:
                  if not member.isfile() or not member.name.startswith('ot/genesis/'):
                      raise SystemExit(f'unexpected bundle member: {member.name}')
                  destination = (root / member.name).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f'unsafe bundle member: {member.name}')
              archive.extractall(root, members=members)
          print(f'extracted {len(members)} Genesis files')
          PY

      - name: Validate staged Genesis shelf
        shell: bash
        run: |
          if [ ! -f tools/genesis-publish.tar.xz.b64 ]; then
            exit 0
          fi
          test -f ot/genesis/ch26.html
          test -f ot/genesis/ch50.html
          grep -q 'genesis-suite.js' ot/genesis/ch50.html
          grep -q '1–50장 전권 완성' ot/genesis/index.html
          python3 - <<'PY'
          from pathlib import Path
          for chapter in range(1, 51):
              page = Path(f'ot/genesis/ch{chapter:02}.html')
              if not page.exists():
                  raise SystemExit(f'missing {page}')
              text = page.read_text(encoding='utf-8')
              for required in ('../../assets/theme.css','../../assets/app.css','./genesis-suite.css','../../assets/css/bible-reader.css','../../assets/app.js','../../assets/js/bible-reader.js','../../assets/js/commentator-chips.js','./genesis-suite.js'):
                  if required not in text:
                      raise SystemExit(f'{page}: missing {required}')
          print('Genesis 1-50 shared assets verified')
          PY

      - name: Install encyclopedia build dependencies
        run: python -m pip install -r tools/requirements-encyclopedia.txt

      - name: Repair independent site assets
        run: python tools/run_site_integrity_batch.py

      - name: Commit integrity repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ot/genesis assets/data/encyclopedia/index.json tools/site-integrity-report.json
          if git diff --cached --quiet; then
            echo "No integrity repairs to commit"
            exit 0
          fi
          git commit -m "Apply independent site integrity repairs"
          git push origin main

      - name: Apply Romans A-E supplement
        continue-on-error: true
        run: python3 tools/apply_romans_patch.py --repo . --write

      - name: Apply screen settings and research dock
        continue-on-error: true
        run: python3 tools/apply_study_tools.py --write

      - name: Apply shared Bible reader
        continue-on-error: true
        run: python3 tools/apply_bible_reader.py --write

      - name: Commit other generated HTML changes
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for directory in ot nt theology; do
            if [ -d "$directory" ]; then
              git add -A "$directory"
            fi
          done
          if git diff --cached --quiet; then
            echo "No additional generated HTML changes"
            exit 0
          fi
          git commit -m "Apply shared study tools"
          git push origin main

      - name: Validate Korean Bible corpus
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path("assets/data/bible/kor")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if "chunks" not in manifest or len(manifest.get("books", {})) < 66:
              print("전체 성경 패키지 업로드 전이므로 본문 검증을 건너뜁니다.")
              raise SystemExit(0)
          assert len(manifest["books"]) == 66, "성경 66권 목록이 아닙니다"

          loaded = {}
          for info in manifest["chunks"].values():
              path = root / info["path"]
              with gzip.open(path, "rt", encoding="utf-8") as handle:
                  chunk = json.load(handle)
              loaded.update(chunk.get("books", chunk))

          assert set(loaded) == set(manifest["books"]), "본문과 목록의 책 구성이 다릅니다"
          total = sum(
              len(verses)
              for book in loaded.values()
              for verses in book["chapters"].values()
          )
          assert total == 31102, f"총 절 수가 올바르지 않습니다: {total}"
          print(f"개역개정 66권 {total:,}절 검증 완료")
          PY

      - name: Validate NA28 corpus when uploaded
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path("assets/data/bible/original/na28")
          manifest_path = root / "manifest.json"
          if not manifest_path.exists():
              print("NA28 manifest가 없어 검증을 건너뜁니다.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          paths = [root / info["path"] for info in manifest.get("chunks", {}).values()]
          missing = [str(path) for path in paths if not path.exists()]
          if missing:
              print("NA28 압축 묶음 업로드 전이므로 검증을 건너뜁니다.")
              for path in missing:
                  print(f"- missing: {path}")
              raise SystemExit(0)

          loaded = {}
          for path in paths:
              with gzip.open(path, "rt", encoding="utf-8") as handle:
                  chunk = json.load(handle)
              loaded.update(chunk.get("books", chunk))

          assert len(loaded) == 27, f"NA28 책 수 오류: {len(loaded)}"
          chapters = sum(len(book["chapters"]) for book in loaded.values())
          verses = sum(
              len(chapter)
              for book in loaded.values()
              for chapter in book["chapters"].values()
          )
          assert chapters == 260, f"NA28 장 수 오류: {chapters}"
          assert verses == 7941, f"NA28 장절 표지 수 오류: {verses}"
          print(f"NA28 27권 {chapters}장 {verses:,}개 장절 표지 검증 완료")
          PY

      - name: Validate cross-reference data
        run: python tools/update_xrefs.py --check

      - name: Validate cross-reference UI
        run: |
          python tools/apply_cross_references.py --check
          node --check assets/app.js
          node --check assets/js/original-reader.js
          node --check assets/js/research-dock.js

      - name: Validate site integrity
        continue-on-error: true
        run: python tools/repair_site_integrity.py

      - name: Validate Romans A-E supplement
        continue-on-error: true
        run: python3 tools/apply_romans_patch.py --repo . --check

      - name: Validate shared study tools
        continue-on-error: true
        run: python3 tools/apply_study_tools.py --check

      - name: Validate shared Bible reader
        continue-on-error: true
        run: python3 tools/apply_bible_reader.py --check
