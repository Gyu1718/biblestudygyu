name: Build local gzip fallback

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply_gzip_fallback.py"
      - ".github/workflows/build-gzip-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/gzip-fallback
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vendor fflate 0.8.2
        shell: bash
        run: |
          rm -rf /tmp/fflate-package
          mkdir -p /tmp/fflate-package assets/vendor
          package_name="$(npm pack fflate@0.8.2 --pack-destination /tmp --silent)"
          tar -xzf "/tmp/${package_name}" -C /tmp/fflate-package
          test -f /tmp/fflate-package/package/umd/index.js
          test -f /tmp/fflate-package/package/LICENSE
          {
            printf '%s\n' '/*! fflate 0.8.2 | MIT License | https://github.com/101arrowz/fflate */'
            cat /tmp/fflate-package/package/umd/index.js
          } > assets/vendor/fflate.min.js
          cp /tmp/fflate-package/package/LICENSE assets/vendor/fflate.LICENSE.txt

      - name: Apply fallback to gzip readers
        run: python tools/apply_gzip_fallback.py --write

      - name: Validate JavaScript and fallback decompression
        run: |
          python tools/apply_gzip_fallback.py --check
          node --check assets/js/bible-reader.js
          node --check assets/js/original-reader.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const zlib = require('zlib');
          const context = { Uint8Array, TextEncoder, TextDecoder };
          context.self = context;
          context.window = context;
          context.globalThis = context;
          vm.runInNewContext(fs.readFileSync('assets/vendor/fflate.min.js', 'utf8'), context);
          if (!context.fflate || typeof context.fflate.gunzipSync !== 'function') {
            throw new Error('fflate UMD global was not initialized');
          }
          const source = Buffer.from(JSON.stringify({books:39, fallback:'ok'}));
          const compressed = zlib.gzipSync(source);
          const output = context.fflate.gunzipSync(new Uint8Array(compressed));
          const decoded = new TextDecoder().decode(output);
          if (decoded !== source.toString()) throw new Error('fflate gzip round trip failed');
          console.log('fflate gzip fallback round trip passed');
          JS

      - name: Commit fallback assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            assets/vendor/fflate.min.js \
            assets/vendor/fflate.LICENSE.txt \
            assets/js/bible-reader.js \
            assets/js/original-reader.js
          if git diff --cached --quiet; then
            echo "No gzip fallback changes"
            exit 0
          fi
          git commit -m "Add local gzip decompression fallback"
          git push origin agent/gzip-fallback
