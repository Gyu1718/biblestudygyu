name: Expand cross-reference coverage

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/update_xrefs.py"
      - "tools/apply_cross_references.py"
      - "data/xrefs/README.md"
      - ".github/workflows/expand-cross-references.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/expand-cross-references
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and build OpenBible cross references
        run: python tools/update_xrefs.py --write

      - name: Apply shared cross-reference UI
        run: python tools/apply_cross_references.py --write

      - name: Validate generated data and UI
        run: |
          python tools/update_xrefs.py --check
          python tools/apply_cross_references.py --check
          node --check assets/app.js
          node --check assets/js/original-reader.js
          node --check assets/js/research-dock.js
          python tools/apply_study_tools.py --check
          python tools/apply_bible_reader.py --check

      - name: Commit generated cross-reference expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/xrefs \
            assets/app.js \
            assets/js/original-reader.js \
            assets/js/research-dock.js \
            assets/css/original-reader.css \
            bible/original.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Expand cross references across current study books"
          git push origin agent/expand-cross-references
