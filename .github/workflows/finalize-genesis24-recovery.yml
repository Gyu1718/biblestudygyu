name: Finalize Genesis 24 recovery edition
# Trigger preservation of original sections 0–7 and the identified supplement for sections 8–16.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/finalize_genesis24_recovery.py"
      - ".github/workflows/finalize-genesis24-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize plain Genesis 24 page
        run: python tools/finalize_genesis24_recovery.py

      - name: Apply shared study tools
        run: python tools/apply_study_tools.py --write

      - name: Apply shared Bible reader
        run: python tools/apply_bible_reader.py --write

      - name: Validate Genesis 21–25 and encyclopedia index
        run: |
          python -m pip install -r tools/requirements-encyclopedia.txt
          python tools/repair_site_integrity.py

      - name: Commit finalized recovery edition
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ot/genesis assets/data/encyclopedia/index.json tools/site-integrity-report.json
          if git diff --cached --quiet; then
            echo "No recovery changes"
            exit 0
          fi
          git commit -m "Finalize Genesis 24 plain HTML recovery edition"
          git push origin main
