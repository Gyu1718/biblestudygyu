name: Fix homepage theme flash

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply_home_theme_fixes.py"
      - ".github/workflows/fix-home-theme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-home-theme-flash
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply homepage theme fixes
        run: python tools/apply_home_theme_fixes.py --write

      - name: Validate homepage theme fixes
        run: |
          python tools/apply_home_theme_fixes.py --check
          node --check catalog.js
          node --check assets/app.js
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert text.index('assets/theme.css') < text.index('<style>')
          assert text.index('assets/css/home-compact.css') > text.index('</style>')
          assert 'data-home-compact-css' not in Path('catalog.js').read_text(encoding='utf-8')
          print('homepage asset order validated')
          PY

      - name: Commit generated homepage fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html catalog.js assets/app.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix homepage theme and layout flash"
          git push origin agent/fix-home-theme-flash
