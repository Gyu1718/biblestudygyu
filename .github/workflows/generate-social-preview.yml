name: Generate social preview metadata

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/generate_social_preview.py"
      - "tools/apply_social_meta.py"
      - ".github/workflows/generate-social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/social-preview-meta
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: |
          python -m pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Generate social preview image
        run: python tools/generate_social_preview.py --write

      - name: Apply social metadata
        run: python tools/apply_social_meta.py --write

      - name: Validate generated social preview
        run: |
          python tools/generate_social_preview.py --check
          python tools/apply_social_meta.py --check

      - name: Commit generated image and metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/og/site-preview.png index.html ot/*/index.html nt/*/index.html
          if git diff --cached --quiet; then
            echo "No social preview changes"
            exit 0
          fi
          git commit -m "Add social preview metadata"
          git push origin agent/social-preview-meta
