name: Recover Genesis fragment gap

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/recover_genesis_fragment_gap.py"
      - ".github/workflows/genesis-fragment-gap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover localized fragment gap
        run: python tools/recover_genesis_fragment_gap.py

      - name: Commit recovery result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ot/genesis tools/genesis-fragment-gap-report.json
          if git diff --cached --quiet; then
            echo "No fragment recovery changes"
            exit 0
          fi
          git commit -m "Recover Genesis fragment gap"
          git push origin main
