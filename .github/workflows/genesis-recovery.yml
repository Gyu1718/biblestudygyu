name: Recover damaged Genesis payloads
# Trigger boundary-level overlap and fragment reconstruction diagnostics.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/recover_genesis_chunk_boundaries.py"
      - "tools/recover_genesis_payloads.py"
      - ".github/workflows/genesis-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install index build dependencies
        run: python -m pip install -r tools/requirements-encyclopedia.txt

      - name: Recover fragment-boundary defects
        run: python tools/recover_genesis_chunk_boundaries.py

      - name: Recover remaining payload defects
        run: python tools/recover_genesis_payloads.py --write

      - name: Rebuild independent site assets
        run: python tools/run_site_integrity_batch.py

      - name: Commit recovered pages and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ot/genesis \
            assets/data/encyclopedia/index.json \
            tools/site-integrity-report.json \
            tools/genesis-boundary-recovery-report.json \
            tools/genesis-payload-recovery-report.json
          if git diff --cached --quiet; then
            echo "No recoverable payload changes"
            exit 0
          fi
          git commit -m "Recover damaged Genesis study payloads"
          git push origin main
