name: Install encyclopedia runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-encyclopedia-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Unpack encyclopedia runtime
        run: |
          cat tools/encyclopedia-install.part00 tools/encyclopedia-install.part01 | base64 -d > /tmp/encyclopedia.tar.gz
          tar -xzf /tmp/encyclopedia.tar.gz -C .

      - name: Connect conditional loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("assets/js/research-dock-loader.js")
          text = path.read_text(encoding="utf-8")
          old = '  addScript("assets/js/research-dock.js?v=20260729.1", "data-research-dock-js");'
          new = '''  if (/\\/ot\\/nehemiah\\//i.test(location.pathname) || document.querySelector("[data-encyclopedia-scan],.encyclopedia-scan,.dict-scan,[data-entity]")) {
    addScript("assets/js/encyclopedia-loader.js?v=20260730.1", "data-encyclopedia-loader-js");
  }

  addScript("assets/js/research-dock.js?v=20260729.1", "data-research-dock-js");'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"research dock loader anchor count: {text.count(old)}")
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate runtime
        run: |
          node --check assets/js/encyclopedia-loader.js
          node --check assets/js/encyclopedia-runtime.js
          node --check assets/js/encyclopedia-detail.js
          node --check assets/js/research-dock-loader.js
          python3 -m py_compile tools/build_encyclopedia_index.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("assets/data/encyclopedia/index.json").read_text(encoding="utf-8"))
          assert len(data) == 7
          nehemiah = next(x for x in data if x["id"] == "nehemiah")
          assert "느헤미야서" in nehemiah["match"]["ignore"]
          runtime = Path("assets/js/encyclopedia-runtime.js").read_text(encoding="utf-8")
          for token in (".scripture-ref", "[data-bible-ref]", "[data-bible-range]", "[data-strong]"):
              assert token in runtime, token
          assert "hideCompetingPopovers" in runtime
          loader = Path("assets/js/research-dock-loader.js").read_text(encoding="utf-8")
          assert "encyclopedia-loader.js?v=20260730.1" in loader
          print("validated", len(data), "encyclopedia entries")
          PY

      - name: Commit installation
        run: |
          rm -f tools/encyclopedia-install.part00 tools/encyclopedia-install.part01
          rm -f .github/workflows/install-encyclopedia-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add scripture-safe encyclopedia hover runtime"
          git push origin main
