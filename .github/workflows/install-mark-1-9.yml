          sha256sum -c /tmp/chunks.sha256

      - name: Reassemble Mark package
        shell: bash
        run: |
          cat .mark-update10/part_0[0-9] .mark-update10/tail_* > /tmp/mark-update-final.tar.xz.b64
          base64 -d /tmp/mark-update-final.tar.xz.b64 > /tmp/mark-update-final.tar.xz
          echo "1325a82518b9d0ee5b46ed71192db650d11681f8c864acd4fd360200ea06ad0c  /tmp/mark-update-final.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mark-update-final.tar.xz -C .

      - name: Validate Mark 1-9 integration
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re
          mark = Path('nt/mark')
          files = [mark/'index.html', mark/'overview.html'] + [mark/f'ch{i:02}.html' for i in range(1, 10)]
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing: {p}')
              text = p.read_text(encoding='utf-8')
              if not text.lstrip().lower().startswith('<!doctype html>'):
                  raise SystemExit(f'{p}: missing doctype')
              ids = re.findall(r'\bid="([^"]+)"', text)
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'{p}: duplicate id')
              for frag in re.findall(r'href="#([^"]+)"', text):
                  if frag and frag not in ids:
                      raise SystemExit(f'{p}: missing fragment #{frag}')
          idx = (mark/'index.html').read_text(encoding='utf-8')
          for i in range(1, 10):
              if f'href="ch{i:02}.html"' not in idx:
                  raise SystemExit(f'index: ch{i:02}.html not active')
          for i in range(10, 17):
              if f'href="ch{i:02}.html"' in idx:
                  raise SystemExit(f'index: ch{i:02}.html should remain inactive')
          if '9/16편' not in idx or '0/16편' in idx or '6/16편' in idx:
              raise SystemExit('index: progress is not 9/16')
          for i in range(1, 10):
              text = (mark/f'ch{i:02}.html').read_text(encoding='utf-8')
              for j in range(1, 10):
                  if f'ch{j:02}.html' not in text:
                      raise SystemExit(f'ch{i:02}: chapter jump missing ch{j:02}')
          catalog = Path('catalog.js').read_text(encoding='utf-8')
          if 'id:"mark"' not in catalog or 'done:9,total:16' not in catalog:
              raise SystemExit('catalog: Mark progress is not 9/16')
          print('Mark 1-9 validation passed')
          PY2

      - name: Commit installed files and cleanup staging
        shell: bash
        run: |
          rm -rf .mark-update9 .mark-update10
          rm -f .github/workflows/install-mark-1-9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Mark 1-9 is already installed"
            exit 0
          fi
          git commit -m "Activate Mark studies through chapter 9"
          git push origin main
