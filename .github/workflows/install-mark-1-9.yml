name: Install Mark 1-9 study update

on:
  push:
    branches: [main]
    paths:
      - ".mark-update10/READY"

permissions:
  contents: write

jobs:
  install-mark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reassemble verified Mark package
        shell: bash
        run: |
          : > /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/part_00 .mark-update10/part_01 .mark-update10/part_02 .mark-update10/part_03 .mark-update10/part_04 .mark-update10/part_05 .mark-update10/part_06 .mark-update10/part_07 .mark-update10/part_08 .mark-update10/part_09 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/tail_00 .mark-update10/tail_01 .mark-update10/tail_02 .mark-update10/tail_03 .mark-update10/tail_04 .mark-update10/tail_05 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/fix_06_00 .mark-update10/fix_06_01 .mark-update10/fix_06_02 .mark-update10/fix_06_03 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/tail_07 .mark-update10/tail_08 .mark-update10/tail_09 .mark-update10/tail_10 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/fix_11_00 .mark-update10/fix_11_01 .mark-update10/fix_11_02 .mark-update10/fix_11_03 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/tail_12 .mark-update10/tail_13 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/fix_14_00 .mark-update10/fix_14_01 .mark-update10/fix_14_02 .mark-update10/fix_14_03 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/tail_15 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/fix_16_00 .mark-update10/fix_16_01 .mark-update10/fix_16_02 .mark-update10/fix_16_03 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/fix_17_00 .mark-update10/fix_17_01 .mark-update10/fix_17_02 .mark-update10/fix_17_03 >> /tmp/mark-update-final.tar.xz.b64
          cat .mark-update10/tail_18 .mark-update10/tail_19 >> /tmp/mark-update-final.tar.xz.b64
          test "$(wc -c < /tmp/mark-update-final.tar.xz.b64)" -eq 317868
          base64 -d /tmp/mark-update-final.tar.xz.b64 > /tmp/mark-update-final.tar.xz
          echo "1325a82518b9d0ee5b46ed71192db650d11681f8c864acd4fd360200ea06ad0c  /tmp/mark-update-final.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mark-update-final.tar.xz -C .

      - name: Validate Mark 1-9 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          mark = Path('nt/mark')
          files = [mark/'index.html', mark/'overview.html'] + [mark/f'ch{i:02}.html' for i in range(1, 10)]
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing: {p}')
              text = p.read_text(encoding='utf-8')
              if not text.lstrip().lower().startswith('<!doctype html>'):
                  raise SystemExit(f'{p}: missing doctype')
              ids = re.findall(r'\bid="([^"]+)"', text)
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'{p}: duplicate id')
              for frag in re.findall(r'href="#([^"]+)"', text):
                  if frag and frag not in ids:
                      raise SystemExit(f'{p}: missing fragment #{frag}')
          idx = (mark/'index.html').read_text(encoding='utf-8')
          for i in range(1, 10):
              if f'href="ch{i:02}.html"' not in idx:
                  raise SystemExit(f'index: ch{i:02}.html not active')
          for i in range(10, 17):
              if f'href="ch{i:02}.html"' in idx:
                  raise SystemExit(f'index: ch{i:02}.html should remain inactive')
          if '9/16편' not in idx or '0/16편' in idx:
              raise SystemExit('index: progress is not 9/16')
          catalog = Path('catalog.js').read_text(encoding='utf-8')
          if 'id:"mark"' not in catalog or 'done:9,total:16' not in catalog:
              raise SystemExit('catalog: Mark progress is not 9/16')
          print('Mark 1-9 validation passed')
          PY

      - name: Commit activation and cleanup
        shell: bash
        run: |
          rm -rf .mark-update9 .mark-update10
          rm -f .github/workflows/install-mark-1-9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Mark studies through chapter 9"
          git push origin main
