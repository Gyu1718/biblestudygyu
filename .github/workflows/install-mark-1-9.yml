name: Install Mark 1-9 study update

on:
  push:
    branches: [main]
    paths:
      - ".mark-update9/READY"

permissions:
  contents: write

jobs:
  install-mark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Reassemble Mark package
        shell: bash
        run: |
          cat .mark-update9/payload_* > /tmp/mark-1-9.tar.xz.b64
          base64 -d /tmp/mark-1-9.tar.xz.b64 > /tmp/mark-1-9.tar.xz
          echo "8c45653f3cdc7485c76a849b5a067d997735c520b4f920cb2bafeea0c81f03b5  /tmp/mark-1-9.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mark-1-9.tar.xz -C .

      - name: Validate Mark 1-9 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          mark = Path('nt/mark')
          files = [mark/'index.html', mark/'overview.html'] + [mark/f'ch{i:02}.html' for i in range(1, 10)]
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing: {p}')
              text = p.read_text(encoding='utf-8')
              if not text.lstrip().lower().startswith('<!doctype html>'):
                  raise SystemExit(f'{p}: missing doctype')
              ids = re.findall(r'\bid="([^"]+)"', text)
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'{p}: duplicate id')
              for frag in re.findall(r'href="#([^"]+)"', text):
                  if frag and frag not in ids:
                      raise SystemExit(f'{p}: missing fragment #{frag}')
          idx = (mark/'index.html').read_text(encoding='utf-8')
          for i in range(1, 10):
              if f'ch{i:02}.html' not in idx:
                  raise SystemExit(f'index: ch{i:02}.html not linked')
          if '9/16편' not in idx:
              raise SystemExit('index: progress is not 9/16')
          catalog = Path('catalog.js').read_text(encoding='utf-8')
          if 'id:"mark"' not in catalog or 'done:9,total:16' not in catalog:
              raise SystemExit('catalog: Mark progress is not 9/16')
          print('Mark 1-9 validation passed')
          PY

      - name: Commit installed files and cleanup staging
        shell: bash
        run: |
          rm -rf .mark-update9
          rm -f .github/workflows/install-mark-1-9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.js nt/mark .mark-update9 .github/workflows/install-mark-1-9.yml
          if git diff --cached --quiet; then
            echo "Mark 1-9 is already installed"
            exit 0
          fi
          git commit -m "Update Mark shelf through chapter 9"
          git push origin main
