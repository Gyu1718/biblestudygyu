name: Install Mark 1-9 study update

on:
  push:
    branches: [main]
    paths:
      - ".mark-update10/READY"

permissions:
  contents: write

jobs:
  install-mark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify staged chunks
        shell: bash
        run: |
          cat > /tmp/chunks.sha256 <<'EOF'
b1d082180944dba5fd1c6a0e086f91c322fd358fe4e467efb9baad4bbf3e95c1  .mark-update10/part_00
