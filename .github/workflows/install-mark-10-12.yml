name: Install Mark 10-12 study update

on:
  push:
    branches: [main]
    paths:
      - ".mark-update12/READY"

permissions:
  contents: write

jobs:
  install-mark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify and extract source payload
        shell: bash
        run: |
          set -euo pipefail
          echo "ea9a8a9d2998e2c181132d6ead48058c44a10e4c15654c58ecb175c331e0cc4e  .mark-update12/part_00" | sha256sum -c -
          echo "2fbaaa0b951bb8187c41f312473a0dd72fc4871a85ebfd8707abbd526e6db002  .mark-update12/part_01" | sha256sum -c -
          echo "688dd3d3c2f2af258fcb00b22d16f5968672bc68850f141dffe9e58b7b827261  .mark-update12/part_02" | sha256sum -c -
          echo "86dfb3894ac18b24805929adb83b0d4250573c8ae91eb5af0ca8ee16d3fbfdb6  .mark-update12/part_03" | sha256sum -c -
          echo "79491e27f6104b506d0f15ab0bd1b19fbf971bb73e4654191ded76a56551f0c3  .mark-update12/part_04" | sha256sum -c -
          echo "96daf8b5bead9562810ce4e6e0f00c259cee3dcd07db8a6ade073bc3099cd111  .mark-update12/part_05" | sha256sum -c -
          echo "c3731a1de8770d1bc01a5f87148f01846d62fc64a4ca5bdae11deaebe3c57325  .mark-update12/part_06" | sha256sum -c -
          echo "444c11594d6cdd856628c1c7c531f8635e6d9442e0841b4e146aad3891621012  .mark-update12/part_07" | sha256sum -c -
          echo "7f50fc04b4e62057f00d169cd3e9a60a8aef49bf016b873c2e0ac5877f21a3fc  .mark-update12/part_08" | sha256sum -c -
          echo "eef4ac3ee3aa175bede849f256784e1d6c30b48721d94da1254642d3ef48e004  .mark-update12/part_09" | sha256sum -c -
          cat .mark-update12/part_00 .mark-update12/part_01 .mark-update12/part_02 .mark-update12/part_03 .mark-update12/part_04 .mark-update12/part_05 .mark-update12/part_06 .mark-update12/part_07 .mark-update12/part_08 .mark-update12/part_09 > /tmp/mark-10-12.tar.xz.b64
          base64 -d /tmp/mark-10-12.tar.xz.b64 > /tmp/mark-10-12.tar.xz
          echo "c0886daf42515c8533c89377d057e3aff344fc18d27ba02d1544bc4faf2dd2b4  /tmp/mark-10-12.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mark-10-12
          tar -xJf /tmp/mark-10-12.tar.xz -C /tmp/mark-10-12
          echo "78da3e895be6b7e7d8352c9f184c3b0a631e49153d394d98fd6e362686d24774  /tmp/mark-10-12/ch10.html" | sha256sum -c -
          echo "c72402510959b690806f41cfbe8fb73c4fa26c9b13d5b17fd41a6df608dc9a64  /tmp/mark-10-12/ch11.html" | sha256sum -c -
          echo "50f5e94b65d18d23124f520cc7e194d377347304a4b20b916c48aa2b525de37a  /tmp/mark-10-12/ch12.html" | sha256sum -c -
          cp /tmp/mark-10-12/ch10.html nt/mark/ch10.html
          cp /tmp/mark-10-12/ch11.html nt/mark/ch11.html
          cp /tmp/mark-10-12/ch12.html nt/mark/ch12.html

      - name: Activate chapters 10 through 12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          active_10_12 = (
              '<a aria-label="마가복음 10장으로 이동" href="./ch10.html">10</a>'
              '<a aria-label="마가복음 11장으로 이동" href="./ch11.html">11</a>'
              '<a aria-label="마가복음 12장으로 이동" href="./ch12.html">12</a>'
          )
          pending_10_12 = '<span>10</span><span>11</span><span>12</span>'

          for i in range(1, 10):
              p = Path(f'nt/mark/ch{i:02}.html')
              text = p.read_text(encoding='utf-8')
              if pending_10_12 not in text:
                  raise SystemExit(f'{p}: pending 10-12 navigation sequence not found')
              text = text.replace(pending_10_12, active_10_12, 1)
              p.write_text(text, encoding='utf-8')

          p9 = Path('nt/mark/ch09.html')
          text = p9.read_text(encoding='utf-8')
          old_next = '<span class="next-off" aria-disabled="true" role="note">10장 준비 중</span>'
          if old_next not in text:
              raise SystemExit('ch09: pending chapter 10 footer link not found')
          text = text.replace(old_next, '<a href="ch10.html">10장 먼저와 나중 →</a>', 1)
          p9.write_text(text, encoding='utf-8')

          idxp = Path('nt/mark/index.html')
          idx = idxp.read_text(encoding='utf-8')
          replacements = [
              ('아홉 권 서가 자료 대조와 1–6장 심층연구를 연결하는 책별 서가.', '아홉 권 서가 자료 대조와 1–12장 심층연구를 연결하는 책별 서가.'),
              ('1–9장 심층연구가 완성되었고, 10–16장은 아홉 권의 서가 자료를 대조하며 순차 제작한다.', '1–12장 심층연구가 완성되었고, 13–16장은 아홉 권의 서가 자료를 대조하며 순차 제작한다.'),
              ('1–9장 완성, 10장부터 순차 제작한다.', '1–12장 완성, 13장부터 순차 제작한다.'),
              ('활성 책등은 완성된 문서이며, 10–16장의 심층연구는 순차 제작 중이다.', '활성 책등은 완성된 문서이며, 13–16장의 심층연구는 순차 제작 중이다.'),
              ('1–9장은 성경읽기와 심층연구가 함께 열리며, 10–16장은 순차로 활성화한다.', '1–12장은 성경읽기와 심층연구가 함께 열리며, 13–16장은 순차로 활성화한다.'),
              ('10장부터 순차 제작하며 완성되는 대로 책등과 장별 링크를 활성화한다.', '13장부터 순차 제작하며 완성되는 대로 책등과 장별 링크를 활성화한다.'),
          ]
          for old, new in replacements:
              if old not in idx:
                  raise SystemExit(f'index: expected text not found: {old}')
              idx = idx.replace(old, new)
          idx = idx.replace('9/16편', '12/16편')
          idx = idx.replace('1–6장 심층연구', '1–12장 심층연구')

          spines = {
              10: ('섬기는 인자', '먼저와 나중'),
              11: ('예루살렘 입성', '성전 대결'),
              12: ('버린 돌 머릿돌', '성전에서의 논쟁'),
          }
          for n, (old_title, new_title) in spines.items():
              old = f'<span class="book-spine pending" aria-disabled="true" data-status="pending"><span class="num">{n:02}</span><span class="title">{old_title}</span><span class="band"></span></span>'
              new = f'<a class="book-spine" href="ch{n:02}.html" data-status="complete"><span class="num">{n:02}</span><span class="title">{new_title}</span><span class="band"></span></a>'
              if old not in idx:
                  raise SystemExit(f'index: pending spine {n} not found')
              idx = idx.replace(old, new, 1)

          for n in (10, 11, 12):
              pat = re.compile(r'(<article class="book-chapter-row"><span class="no">' + str(n) + r'</span>.*?</article>)', re.S)
              m = pat.search(idx)
              if not m:
                  raise SystemExit(f'index: chapter row {n} not found')
              row = m.group(1)
              pending = '<span class="disabled">심층연구 준비 중</span>'
              if pending not in row:
                  raise SystemExit(f'index: chapter row {n} deep-study pending action not found')
              row2 = row.replace(pending, f'<a href="ch{n:02}.html">심층연구</a>', 1)
              idx = idx[:m.start(1)] + row2 + idx[m.end(1):]

          idxp.write_text(idx, encoding='utf-8')

          ovp = Path('nt/mark/overview.html')
          ov = ovp.read_text(encoding='utf-8')
          if '1–9장' not in ov:
              raise SystemExit('overview: 1-9 status text not found')
          ov = ov.replace('1–9장', '1–12장')
          ov = ov.replace('10장부터 자료 파일 대조와 함께 순차 제작한다.', '13장부터 자료 파일 대조와 함께 순차 제작한다.')
          ovp.write_text(ov, encoding='utf-8')

          cp = Path('catalog.js')
          cat = cp.read_text(encoding='utf-8')
          for old, new in [
              ('장별 심층연구 9편', '장별 심층연구 12편'),
              ('done:9,total:16', 'done:12,total:16'),
              ('1–9장 심층연구', '1–12장 심층연구'),
          ]:
              if old not in cat:
                  raise SystemExit(f'catalog: expected text not found: {old}')
              cat = cat.replace(old, new, 1)
          cp.write_text(cat, encoding='utf-8')
          PY

      - name: Validate Mark 1-12 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          expected = {
              10: '78da3e895be6b7e7d8352c9f184c3b0a631e49153d394d98fd6e362686d24774',
              11: 'c72402510959b690806f41cfbe8fb73c4fa26c9b13d5b17fd41a6df608dc9a64',
              12: '50f5e94b65d18d23124f520cc7e194d377347304a4b20b916c48aa2b525de37a',
          }
          for n, sha in expected.items():
              p = Path(f'nt/mark/ch{n:02}.html')
              got = hashlib.sha256(p.read_bytes()).hexdigest()
              if got != sha:
                  raise SystemExit(f'{p}: source hash mismatch: {got}')

          mark = Path('nt/mark')
          files = [mark/'index.html', mark/'overview.html'] + [mark/f'ch{i:02}.html' for i in range(1, 13)]
          for p in files:
              if not p.exists():
                  raise SystemExit(f'missing: {p}')
              text = p.read_text(encoding='utf-8')
              if not text.lstrip().lower().startswith('<!doctype html>'):
                  raise SystemExit(f'{p}: missing doctype')
              ids = re.findall(r'\bid="([^"]+)"', text)
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'{p}: duplicate id')
              for frag in re.findall(r'href="#([^"]+)"', text):
                  if frag and frag not in ids:
                      raise SystemExit(f'{p}: missing fragment #{frag}')

          idx = (mark/'index.html').read_text(encoding='utf-8')
          for i in range(1, 13):
              if f'href="ch{i:02}.html"' not in idx:
                  raise SystemExit(f'index: ch{i:02}.html not active')
          for i in range(13, 17):
              if f'href="ch{i:02}.html"' in idx:
                  raise SystemExit(f'index: ch{i:02}.html should remain inactive')
          if '12/16편' not in idx or '9/16편' in idx:
              raise SystemExit('index: progress is not 12/16')

          for i in range(1, 10):
              t = (mark/f'ch{i:02}.html').read_text(encoding='utf-8')
              for n in (10, 11, 12):
                  if f'href="./ch{n:02}.html"' not in t:
                      raise SystemExit(f'ch{i:02}: chapter {n} jump not active')
          if 'href="ch10.html"' not in (mark/'ch09.html').read_text(encoding='utf-8'):
              raise SystemExit('ch09: footer link to ch10 missing')
          if 'href="ch11.html"' not in (mark/'ch10.html').read_text(encoding='utf-8'):
              raise SystemExit('ch10: footer link to ch11 missing')
          if 'href="ch12.html"' not in (mark/'ch11.html').read_text(encoding='utf-8'):
              raise SystemExit('ch11: footer link to ch12 missing')
          if '13장 준비 중' not in (mark/'ch12.html').read_text(encoding='utf-8'):
              raise SystemExit('ch12: chapter 13 should remain pending')

          cat = Path('catalog.js').read_text(encoding='utf-8')
          if 'done:12,total:16' not in cat or '장별 심층연구 12편' not in cat:
              raise SystemExit('catalog: Mark progress is not 12/16')
          print('Mark 1-12 validation passed')
          PY

      - name: Commit activation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mark-update12
          rm -f .github/workflows/install-mark-10-12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate Mark studies through chapter 12"
          git push origin main
