name: Install Mark shelf update

on:
  push:
    branches: [update-mark-shelf-1-6]
    paths:
      - ".mark-update/READY"

permissions:
  contents: write

jobs:
  install-mark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: update-mark-shelf-1-6

      - name: Reassemble uploaded package
        shell: bash
        run: |
          cat .mark-update/chunk_* > /tmp/mark-update.tar.gz.b64
          base64 -d /tmp/mark-update.tar.gz.b64 > /tmp/mark-update.tar.gz
          echo "a1349bd98a91138ad8de417864bc6a0b2981e82e977529159e5816c1569dde8b  /tmp/mark-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mark-update.tar.gz -C .

      - name: Validate installed Mark shelf
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          files = [Path('nt/mark/index.html'), Path('nt/mark/overview.html')] + [Path(f'nt/mark/ch{i:02}.html') for i in range(1, 7)]
          for p in files:
              text = p.read_text(encoding='utf-8')
              if not text.lstrip().lower().startswith('<!doctype html>'):
                  raise SystemExit(f'{p}: missing doctype')
              if p.name.startswith('ch'):
                  n = int(p.stem[2:])
                  if f'data-book="mark"' not in text or f'data-chapter="{n}"' not in text:
                      raise SystemExit(f'{p}: metadata mismatch')
              ids = re.findall(r'\bid="([^"]+)"', text)
              if len(ids) != len(set(ids)):
                  raise SystemExit(f'{p}: duplicate id')
              for frag in re.findall(r'href="#([^"]+)"', text):
                  if frag and frag not in ids:
                      raise SystemExit(f'{p}: missing fragment #{frag}')
          idx = Path('nt/mark/index.html').read_text(encoding='utf-8')
          for i in range(1, 7):
              if f'ch{i:02}.html' not in idx:
                  raise SystemExit(f'index: ch{i:02}.html not linked')
          catalog = Path('catalog.js').read_text(encoding='utf-8')
          if 'id:"mark"' not in catalog or 'done:6,total:16' not in catalog:
              raise SystemExit('catalog: Mark progress is not 6/16')
          print('Mark shelf validation passed')
          PY

      - name: Commit assembled update
        shell: bash
        run: |
          rm -rf .mark-update
          git rm .github/workflows/install-mark-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js nt/mark
          git commit -m "Update Mark shelf with chapters 1-6"
          git push origin HEAD:update-mark-shelf-1-6
