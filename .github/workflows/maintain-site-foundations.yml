name: Maintain site foundations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-or-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node for reader dependencies and syntax checks
        if: github.event.pull_request.head.ref == 'fix/site-foundations-404-sitemap'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load current maintenance tools from main
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:tools/maintain_site_foundations.py > /tmp/maintain_site_foundations.py
          if [ "${{ github.event.pull_request.head.ref }}" = "fix/site-foundations-404-sitemap" ]; then
            git show origin/main:tools/apply_oshb_local_data.py > tools/apply_oshb_local_data.py
            git show origin/main:tools/apply_gzip_fallback.py > tools/apply_gzip_fallback.py
            git show origin/main:tools/build_oshb_chunks.py > tools/build_oshb_chunks.py
            git show origin/main:tools/remap_oshb_versification.py > tools/remap_oshb_versification.py
            rm -f tools/remap_oshb_joel.py
          fi

      - name: Apply the current cleanup migration
        if: github.event.pull_request.head.ref == 'fix/site-foundations-404-sitemap'
        shell: bash
        run: |
          python /tmp/maintain_site_foundations.py

          if [ ! -f assets/data/bible/original/oshb/manifest.json ]; then
            python tools/build_oshb_chunks.py --write --workers 4 || test -f assets/data/bible/original/oshb/manifest.json
            python tools/remap_oshb_versification.py --write
          fi

          if [ ! -f assets/vendor/fflate.min.js ] || [ ! -f assets/vendor/fflate.LICENSE.txt ]; then
            rm -rf /tmp/fflate-package /tmp/fflate-*.tgz
            mkdir -p /tmp/fflate-package assets/vendor
            package_name="$(npm pack fflate@0.8.2 --pack-destination /tmp --silent)"
            tar -xzf "/tmp/${package_name}" -C /tmp/fflate-package
            test -f /tmp/fflate-package/package/umd/index.js
            test -f /tmp/fflate-package/package/LICENSE
            {
              printf '%s\n' '/*! fflate 0.8.2 | MIT License | https://github.com/101arrowz/fflate */'
              cat /tmp/fflate-package/package/umd/index.js
            } > assets/vendor/fflate.min.js
            cp /tmp/fflate-package/package/LICENSE assets/vendor/fflate.LICENSE.txt
          fi

          python tools/apply_oshb_local_data.py --write
          python tools/apply_gzip_fallback.py --write
          python tools/build_oshb_chunks.py --check
          python tools/remap_oshb_versification.py --check
          python tools/apply_oshb_local_data.py --check
          python tools/apply_gzip_fallback.py --check
          node --check assets/js/bible-reader.js
          node --check assets/js/original-reader.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const zlib = require('zlib');
          const context = { Uint8Array, TextEncoder, TextDecoder };
          context.self = context;
          context.window = context;
          context.globalThis = context;
          vm.runInNewContext(fs.readFileSync('assets/vendor/fflate.min.js', 'utf8'), context);
          const source = Buffer.from('scriptorium gzip fallback');
          const output = context.fflate.gunzipSync(new Uint8Array(zlib.gzipSync(source)));
          if (new TextDecoder().decode(output) !== source.toString()) throw new Error('fallback validation failed');
          JS

          python tools/apply_site_search.py --write
          python tools/build_search_index.py --write
          python tools/apply_site_search.py --check
          python tools/build_search_index.py --check
          rm -f .github/workflows/repair-remaining-site.yml
          rm -f .github/site-maintenance-trigger
          rm -f .github/site-accessibility-trigger
          rm -f .github/site-reader-trigger

      - name: Commit migration results
        if: github.event.pull_request.head.ref == 'fix/site-foundations-404-sitemap'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore local Bible data and browser fallbacks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Validate ordinary pull requests
        if: github.event.pull_request.head.ref != 'fix/site-foundations-404-sitemap' && hashFiles('404.html') != ''
        shell: bash
        run: |
          python /tmp/maintain_site_foundations.py --check
          python tools/apply_site_search.py --check
          python tools/build_search_index.py --check
