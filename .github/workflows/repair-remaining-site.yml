name: Repair remaining site foundations

on:
  push:
    branches:
      - fix/site-foundations-404-sitemap

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/site-foundations-404-sitemap
          fetch-depth: 0

      - name: Apply remaining repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          from urllib.parse import quote

          root = Path('.')
          version = '20260802.1'

          # 14. Replace the obsolete one-link noscript fallback with all current entry points.
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          old = '<main id="shelves"><noscript><section class="shelf-sec"><div class="sec-head"><h2>구약 연구</h2></div><p><a href="ot/nehemiah/index.html">느헤미야 심층 연구 — 전 14권</a></p></section></noscript></main>'
          new = '''<main id="shelves"><noscript>
          <section class="shelf-sec"><div class="sec-head"><h2>성경과 원어 도구</h2></div><p><a href="bible/original.html">성경읽기</a> · <a href="lexicon/index.html">히브리어·헬라어 스트롱 사전</a> · <a href="search/index.html">사이트 전체 검색</a></p></section>
          <section class="shelf-sec"><div class="sec-head"><h2>구약 연구</h2></div><p><a href="ot/genesis/index.html">창세기</a> · <a href="ot/nehemiah/index.html">느헤미야</a> · <a href="ot/esther/index.html">에스더</a> · <a href="ot/psalms/index.html">시편</a> · <a href="ot/hosea/index.html">호세아</a> · <a href="ot/joel/index.html">요엘</a> · <a href="ot/haggai/index.html">학개</a></p></section>
          <section class="shelf-sec"><div class="sec-head"><h2>신약 연구</h2></div><p><a href="nt/acts/index.html">사도행전</a> · <a href="nt/romans/index.html">로마서</a></p></section>
          </noscript></main>'''
          if old not in text:
              raise SystemExit('obsolete noscript block was not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 15. Remove deployment-only and abandoned work directories.
          for name in ('repo_files', 'auto_contrast_patch', 'optional-assets', 'package-info', 'examples', 'templates'):
              path = root / name
              if path.exists():
                  shutil.rmtree(path)
          delete_list = root / 'DELETE-FILES.txt'
          if delete_list.exists():
              delete_list.unlink()

          # 16. Repair the malformed initial Acts link.
          acts = root / 'nt/acts/commentary-addenda.html'
          acts_text = acts.read_text(encoding='utf-8')
          acts.write_text(acts_text.replace('id="study" href="ch"', 'id="study" href="ch01.html"', 1), encoding='utf-8')

          # Use one cache generation across public HTML and loaders.
          excluded = {'.git', '.github', 'tools', 'repo_files', 'auto_contrast_patch', 'optional-assets', 'package-info', 'examples', 'templates'}
          version_re = re.compile(r'\?v=\d{8}(?:\.\d+)?')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.css'}:
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = version_re.sub('?v=' + version, source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          # Generate a complete sitemap from live, indexable HTML.
          live_roots = {'bible', 'content', 'lexicon', 'nt', 'ot', 'search'}
          urls = []
          for path in sorted(root.rglob('*.html')):
              rel = path.relative_to(root)
              if rel.parts[0].startswith('.') or any(part in excluded for part in rel.parts):
                  continue
              if len(rel.parts) > 1 and rel.parts[0] not in live_roots:
                  continue
              source = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'<meta\s+name=["\']robots["\'][^>]*noindex', source, re.I):
                  continue
              posix = rel.as_posix()
              if posix == 'index.html':
                  url_path = ''
              elif posix.endswith('/index.html'):
                  url_path = posix[:-10]
              else:
                  url_path = posix
              encoded = '/'.join(quote(segment) for segment in url_path.split('/'))
              urls.append('https://gyu1718.github.io/biblestudygyu/' + encoded)

          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          sitemap.extend(f'  <url><loc>{url}</loc></url>' for url in sorted(set(urls)))
          sitemap.append('</urlset>')
          (root / 'sitemap.xml').write_text('\n'.join(sitemap) + '\n', encoding='utf-8')
          print(f'Generated sitemap with {len(set(urls))} URLs')
          PY

          # Keep the static search index synchronized after adding/removing HTML.
          python tools/apply_site_search.py
          python tools/build_search_index.py
          python tools/apply_site_search.py --check
          python tools/build_search_index.py --check

          # This workflow is intentionally self-removing after the migration.
          rm -f .github/workflows/repair-remaining-site.yml

      - name: Commit generated repairs
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete site foundation and deployment cleanup"
          git push origin HEAD:fix/site-foundations-404-sitemap
