name: Validate social preview

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ot/*/index.html"
      - "nt/*/index.html"
      - "assets/og/site-preview.png"
      - "tools/generate_social_preview.py"
      - "tools/apply_social_meta.py"
      - ".github/workflows/validate-social-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "ot/*/index.html"
      - "nt/*/index.html"
      - "assets/og/site-preview.png"
      - "tools/generate_social_preview.py"
      - "tools/apply_social_meta.py"
      - ".github/workflows/validate-social-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Validate image and metadata
        run: |
          python tools/generate_social_preview.py --check
          python tools/apply_social_meta.py --check
